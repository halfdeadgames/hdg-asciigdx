buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:9.4.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':sandbox-android')) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17
  java.targetCompatibility = 17

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }

  tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'hdg-asciigdx'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

apply plugin: 'checkstyle'

repositories {
  mavenCentral()
}

checkstyle {
  toolVersion = '10.21.4'
}

// Report-only Google Java Style check for every module (config/checkstyle/style.xml; see CLAUDE.md).
tasks.register('styleCheck', Checkstyle) {
  group = 'verification'
  description = 'Reports Google Java Style violations in all modules. Never fails the build.'
  source = fileTree(rootDir) {
    include '*/src/**/*.java'
    exclude '*/build/**'
  }
  classpath = files()
  checkstyleClasspath = configurations.checkstyle
  configFile = file('config/checkstyle/style.xml')
  configDirectory = file('config/checkstyle')
  ignoreFailures = true
  maxWarnings = Integer.MAX_VALUE
  showViolations = false
  reports {
    xml.required = true
    html.required = true
    xml.outputLocation = layout.buildDirectory.file('reports/style/style.xml')
    html.outputLocation = layout.buildDirectory.file('reports/style/style.html')
  }
}

eclipse.project.name = 'hdg-asciigdx' + '-parent'
