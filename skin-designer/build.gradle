plugins {
  id "application"
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
application.mainClass = 'com.github.halfdeadgames.asciigdx.skindesigner.SkinDesignerLauncher'
eclipse.project.name = appName + '-skin-designer'
java.sourceCompatibility = 17
java.targetCompatibility = 17
if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(17)
}

dependencies {
  implementation project(':core')
  implementation project(':asciigdx-ui')
  implementation project(':input-script')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

  testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  // Forces LWJGL3 to use at least $lwjgl3Version, currently 3.4.3, to avoid warnings on Java 25 and up.
  constraints {
    implementation("org.lwjgl:lwjgl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-glfw:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-jemalloc:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-openal:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-opengl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-stb:$lwjgl3Version")
  }
}

test {
  useJUnitPlatform()
}

def os = System.properties['os.name'].toLowerCase(Locale.ROOT)

// The skin file lives in the shared root assets folder, so the app runs from there.
run {
  workingDir = rootProject.file('assets').path
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
  jvmArgs += "--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED"
  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
  environment("__GL_THREADED_OPTIMIZATIONS", 0)
  // Read from the command line: project.property('script') clashes with Project.script().
  def commandLineProperties = gradle.startParameter.projectProperties
  if (commandLineProperties.containsKey('window')) {
    systemProperty 'asciigdx.window', commandLineProperties['window']
  }
  if (commandLineProperties.containsKey('script')) {
    def scriptCaptureDirectory = layout.buildDirectory.dir('captures/script').get().asFile
    doFirst {
      scriptCaptureDirectory.mkdirs()
      systemProperty 'asciigdx.script', rootProject.file(commandLineProperties['script']).absolutePath
      systemProperty 'asciigdx.scriptCaptures', scriptCaptureDirectory.absolutePath
    }
  }
  if (commandLineProperties.containsKey('capture')) {
    def captureDirectory = layout.buildDirectory.dir('captures').get().asFile
    doFirst {
      captureDirectory.mkdirs()
      systemProperty 'asciigdx.capture', captureDirectory.absolutePath
      ['samples', 'sampleSeconds', 'warmUpSeconds'].each { key ->
        if (commandLineProperties.containsKey(key)) systemProperty "asciigdx.$key", commandLineProperties[key]
      }
      println "Capture output: ${captureDirectory.absolutePath}"
    }
  }
}

// Live code reload: runs the skin designer on a JetBrains Runtime with HotswapAgent. Set hotswapJdk
// (the runtime folder, holding lib/hotswap/hotswap-agent.jar) in ~/.gradle/gradle.properties.
// After a code change, build the classes (Android Studio Build, or :skin-designer:classes) and the
// agent reloads them; press F5 in the app to rebuild the shown example.
def hotswapSourceProjects = [':skin-designer', ':asciigdx-ui', ':core', ':input-script']
def hotswapSettingsDirectory = layout.buildDirectory.dir('hotswap')
tasks.register('runHotswap', JavaExec) {
  description = 'Runs the skin designer with live class reload. Needs the hotswapJdk property.'
  group = 'application'
  hotswapSourceProjects.each { dependsOn "${it}:classes" }
  mainClass = application.mainClass
  workingDir = rootProject.file('assets').path
  classpath = files(hotswapSettingsDirectory) +
      files(hotswapSourceProjects.collect { project(it).sourceSets.main.output }) +
      sourceSets.main.runtimeClasspath
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
  jvmArgs += "--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED"
  jvmArgs += "-XX:+AllowEnhancedClassRedefinition"
  jvmArgs += "-XX:HotswapAgent=fatjar"
  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
  environment("__GL_THREADED_OPTIMIZATIONS", 0)
  def runtimeFolder = project.findProperty('hotswapJdk')
  def windowSize = project.findProperty('window')
  doFirst {
    if (runtimeFolder == null) {
      throw new GradleException('Set hotswapJdk to a JetBrains Runtime folder in ~/.gradle/gradle.properties.')
    }
    def javaName = os.contains('win') ? 'java.exe' : 'java'
    def javaFile = new File(runtimeFolder.toString(), "bin/$javaName")
    if (!javaFile.exists()) throw new GradleException("No java at $javaFile")
    executable = javaFile.absolutePath
    def settingsFile = hotswapSettingsDirectory.get().file('hotswap-agent.properties').asFile
    settingsFile.parentFile.mkdirs()
    settingsFile.text = 'autoHotswap=true\n'
    if (windowSize != null) systemProperty 'asciigdx.window', windowSize
  }
}
