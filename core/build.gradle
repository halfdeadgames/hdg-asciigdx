plugins {
  id 'me.champeau.jmh' version '0.7.4'
}

eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.github.tommyettinger:colorful:$colorfulVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

// Moby Hyphenation List (public domain, Project Gutenberg): test data only, never in the jar.
// Project Gutenberg rate-limits automated clients, so the download is a one-time manual task:
//   .\gradlew.bat :core:downloadMobyHyphenation
// It makes one request, never retries, and keeps the file in the Gradle user home for all worktrees.
def mobyCacheFile = new File(gradle.gradleUserHomeDir, 'caches/hdg-asciigdx/moby/mhyph.txt')
def mobySampleFile = file('src/test/resources/com/github/halfdeadgames/asciigdx/text/moby-hyphenation-sample.txt')
def mobySampleSize = 10000

tasks.register('downloadMobyHyphenation') {
  group = 'verification'
  description = 'Downloads the Moby Hyphenation List once into the Gradle user home cache (one request, no retries).'
  def downloadUrl = (project.findProperty('mobyHyphenationUrl') ?: 'https://www.gutenberg.org/files/3204/files/mhyph.txt').toString()
  def expectedSha256 = (project.findProperty('mobyHyphenationSha256') ?: '').toString().trim().toLowerCase()
  doLast {
    if (mobyCacheFile.exists()) {
      logger.lifecycle("Moby list already cached at ${mobyCacheFile}; nothing to do.")
      return
    }
    mobyCacheFile.parentFile.mkdirs()
    def tempFile = new File(mobyCacheFile.parentFile, 'mhyph.txt.part')
    def connection = new URL(downloadUrl).openConnection() as HttpURLConnection
    connection.setRequestProperty('User-Agent', 'hdg-asciigdx-build')
    connection.connectTimeout = 30000
    connection.readTimeout = 120000
    try {
      int status = connection.responseCode
      if (status != 200) {
        def retryAfter = connection.getHeaderField('Retry-After')
        throw new GradleException("Moby download failed with HTTP ${status}" +
            (retryAfter != null ? ", Retry-After: ${retryAfter}" : '') +
            '. Do not retry before that time.')
      }
      connection.inputStream.withCloseable { input ->
        tempFile.withOutputStream { output -> output << input }
      }
    } finally {
      connection.disconnect()
    }
    long expectedLength = connection.contentLengthLong
    if (expectedLength >= 0 && tempFile.length() != expectedLength) {
      long actualLength = tempFile.length()
      tempFile.delete()
      throw new GradleException("Moby download is incomplete: got ${actualLength} bytes, expected ${expectedLength}. Do not retry automatically.")
    }
    def firstLine = tempFile.readLines('ISO-8859-1').find { !it.trim().isEmpty() }
    if (firstLine != null && firstLine.trim().startsWith('<')) {
      tempFile.delete()
      throw new GradleException('Moby download looks like an HTML page, not the list. Do not retry automatically.')
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    def actualSha256 = digest.digest(tempFile.bytes).encodeHex().toString()
    logger.lifecycle("Downloaded Moby list, SHA-256 ${actualSha256}")
    if (!expectedSha256.isEmpty() && expectedSha256 != actualSha256) {
      tempFile.delete()
      throw new GradleException("Moby list SHA-256 mismatch: expected ${expectedSha256}, got ${actualSha256}")
    }
    if (!tempFile.renameTo(mobyCacheFile)) {
      throw new GradleException("Could not move ${tempFile} to ${mobyCacheFile}")
    }
  }
}

tasks.register('buildMobyHyphenationSample') {
  group = 'verification'
  description = 'Writes an evenly spread sample of about 10,000 Moby words to the core test resources.'
  doLast {
    if (!mobyCacheFile.exists()) {
      throw new GradleException("Moby list not cached at ${mobyCacheFile}. Run :core:downloadMobyHyphenation first.")
    }
    // Moby separates syllables with the Mac Roman bullet (byte 0xA5, U+2022).
    def bullet = '•'
    def keptWords = []
    mobyCacheFile.withReader('x-MacRoman') { reader ->
      reader.eachLine { line ->
        if (line.replace(bullet, '') ==~ /[A-Za-z]+/) {
          keptWords << line.replace(bullet, '-')
        }
      }
    }
    if (keptWords.isEmpty()) {
      throw new GradleException('No usable entries found in the Moby list; is the file complete?')
    }
    int step = Math.max(1, (int) (keptWords.size() / mobySampleSize))
    def sample = []
    for (int i = 0; i < keptWords.size(); i += step) {
      sample << keptWords[i]
    }
    mobySampleFile.parentFile.mkdirs()
    mobySampleFile.withWriter('UTF-8') { writer ->
      writer.write('# Source: Moby Hyphenation List by Grady Ward, public domain, via Project Gutenberg.\n')
      writer.write("# A sample made by the buildMobyHyphenationSample task: every ${step}th usable entry (${sample.size()} of ${keptWords.size()}).\n")
      writer.write('# Syllable breaks are dictionary splits, not typesetting breaks.\n')
      sample.each { writer.write(it + '\n') }
    }
    logger.lifecycle("Wrote ${sample.size()} words to ${mobySampleFile}")
  }
}

test {
  useJUnitPlatform()
  if (mobyCacheFile.exists()) {
    systemProperty 'mobyHyphenationFile', mobyCacheFile.absolutePath
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// CPU-only microbenchmarks in src/jmh/java; never part of the core jar.
// Run all: .\gradlew.bat :core:jmh   Run some: .\gradlew.bat :core:jmh -PjmhIncludes=GridSet
// Tighter error margins for before/after comparisons: -PjmhForks=3 -PjmhIterations=10
jmh {
  jmhVersion = '1.37'
  includes = [project.findProperty('jmhIncludes') ?: '.*']
  fork = (project.findProperty('jmhForks') ?: '2') as int
  warmupIterations = 5
  warmup = '1s'
  iterations = (project.findProperty('jmhIterations') ?: '5') as int
  timeOnIteration = '1s'
  resultFormat = 'JSON'
}
