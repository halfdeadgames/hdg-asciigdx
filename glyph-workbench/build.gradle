plugins {
  id "application"
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
application.mainClass = 'com.github.halfdeadgames.asciigdx.workbench.WorkbenchLauncher'
eclipse.project.name = appName + '-glyph-workbench'
java.sourceCompatibility = 17
java.targetCompatibility = 17
if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(17)
}

dependencies {
  implementation project(':sandbox')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  constraints {
    implementation("org.lwjgl:lwjgl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-glfw:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-jemalloc:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-openal:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-opengl:$lwjgl3Version")
    implementation("org.lwjgl:lwjgl-stb:$lwjgl3Version")
  }
  testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
  useJUnitPlatform()
  systemProperty 'workbench.repoRoot', rootProject.projectDir.absolutePath
}

tasks.register('exportFont', JavaExec) {
  description = 'Exports a font data file to a glyph sheet PNG and character list. See FontExporter.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.github.halfdeadgames.asciigdx.workbench.fontdata.FontExporter'
  def exportDirectory = rootProject.layout.buildDirectory.dir('exports').get().asFile
  def commandLineProperties = gradle.startParameter.projectProperties
  doFirst {
    exportDirectory.mkdirs()
    systemProperty 'workbench.export.output', exportDirectory.absolutePath
    def fontDir = commandLineProperties.getOrDefault('fontDir', 'fonts/saiksistt')
    systemProperty 'workbench.export.fontDir', rootProject.file(fontDir).absolutePath
    systemProperty 'workbench.export.fontSize', commandLineProperties.getOrDefault('fontSize', '8')
  }
}

run {
  workingDir = rootProject.file('assets').path
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
  jvmArgs += "--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED"
  if (System.properties['os.name'].toLowerCase(Locale.ROOT).contains('mac')) jvmArgs += "-XstartOnFirstThread"
  environment("__GL_THREADED_OPTIMIZATIONS", 0)
  def commandLineProperties = gradle.startParameter.projectProperties
  if (commandLineProperties.containsKey('select')) systemProperty 'workbench.select', commandLineProperties['select']
  if (commandLineProperties.containsKey('tab')) systemProperty 'workbench.tab', commandLineProperties['tab']
  if (commandLineProperties.containsKey('window')) systemProperty 'workbench.window', commandLineProperties['window']
  if (commandLineProperties.containsKey('mode')) systemProperty 'workbench.mode', commandLineProperties['mode']
  if (commandLineProperties.containsKey('scale')) systemProperty 'workbench.scale', commandLineProperties['scale']
  systemProperty 'workbench.fontsRoot', commandLineProperties['fontsRoot'] ?: rootProject.file('fonts').absolutePath
  systemProperty 'workbench.fontSize', commandLineProperties.getOrDefault('fontSize', '8')
  if (commandLineProperties.containsKey('rulesOpen')) systemProperty 'workbench.rulesOpen', 'true'
  if (commandLineProperties.containsKey('derive')) systemProperty 'workbench.derive', commandLineProperties['derive']
  if (commandLineProperties.containsKey('guides')) systemProperty 'workbench.guides', commandLineProperties['guides']
  if (commandLineProperties.containsKey('menu')) systemProperty 'workbench.menu', commandLineProperties['menu']
  if (commandLineProperties.containsKey('newglyph')) systemProperty 'workbench.newglyph', commandLineProperties['newglyph']
  if (commandLineProperties.containsKey('newsize')) systemProperty 'workbench.newsize', commandLineProperties['newsize']
  if (commandLineProperties.containsKey('newfont')) systemProperty 'workbench.newfont', commandLineProperties['newfont']
  if (commandLineProperties.containsKey('newfontsize')) systemProperty 'workbench.newfontsize', commandLineProperties['newfontsize']
  def rulesFontDir = commandLineProperties.containsKey('fontDir') ? commandLineProperties['fontDir'] : 'fonts/saiksistt'
  systemProperty 'workbench.fontDir', rootProject.file(rulesFontDir).absolutePath
  systemProperty 'workbench.repoRoot', rootProject.projectDir.absolutePath
  if (commandLineProperties.containsKey('script')) systemProperty 'workbench.script', rootProject.file(commandLineProperties['script']).absolutePath
  if (commandLineProperties.containsKey('capture')) {
    def captureFile = rootProject.layout.buildDirectory.file('captures/workbench.png').get().asFile
    doFirst { captureFile.parentFile.mkdirs() }
    systemProperty 'workbench.capture', captureFile.absolutePath
  }
}
