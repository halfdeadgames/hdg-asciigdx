eclipse.project.name = appName + '-asciigdx-ui'

dependencies {
  api project(':core')

  testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
  useJUnitPlatform()
}

javadoc {
  options.addBooleanOption('Xwerror', true)
}
